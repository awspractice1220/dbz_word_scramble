<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DBZ Word Scramble</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <script defer src="/static/js/game.js"></script>
</head>

<body>

    <!-- Cinematic DBZ Background -->
    <div class="dbz-background"></div>

    <!-- Main Container -->
    <div class="game-container">

        <!-- Luxury Jacob & Co Clock -->
        <div class="luxury-clock">
            <canvas id="clockCanvas" width="200" height="200"></canvas>
        </div>

        <!-- Game Panel -->
        <div class="game-panel">
            <h1 class="title">DBZ Word Scramble</h1>

            <div class="scramble-box">
                <p id="scrambledWord" class="scrambled">Loading...</p>
            </div>

            <input id="answerInput" class="answer-input" placeholder="Type your answer...">

            <button id="submitBtn" class="submit-btn">Submit</button>

            <div class="score-box">
                <p>Score: <span id="scoreValue">0</span></p>
                <p>Difficulty: <span id="difficultyValue">1</span></p>
            </div>

            <button id="newWordBtn" class="newword-btn">New Word</button>
        </div>

    </div>

</body>
</html>
